[profile.default]
src            = "src"
out            = "out"
libs           = ["../lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = true
evm_version    = "paris"

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"
arbitrum_one     = "${ARB_ONE_RPC}"
robinhood_chain  = "${ROBINHOOD_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum_one     = { key = "${ARBISCAN_KEY}", url = "https://api.arbiscan.io/api" }
# Robinhood Chain explorer — update URL once live
# robinhood_chain = { key = "${ROBINHOOD_EXPLORER_KEY}", url = "https://explorer.robinhoodchain.com/api" }
